[GENERAL]
KEEP_ALIVE = "5m"
BASE_URL = ""
# HIDDEN_MODELS, [GENERAL.RETENTION], and PRIVATE_SESSION_DURATION_MINUTES have
# been migrated to the database (app_settings table). Manage them from
# Settings → Model Visibility / Retention. Selected models (embedding +
# memory-processing model) are likewise DB-backed and configured from the
# Settings UI.

[SECURITY]
# REQUIRED for credential storage. A passphrase of your choosing, used to
# derive the key that encrypts provider/search API keys and MCP auth at rest
# (AES-256-GCM). Until this is set, the app blocks
# usage and the Settings UI shows an error. Changing it later re-derives a
# different key, so existing encrypted credentials become unreadable and must
# be re-entered via Settings.
ENCRYPTION_PASSPHRASE = ""

# Model/search provider API keys have migrated to the database (`credentials`
# table, encrypted). Manage them from Settings → API Keys / Search Providers.
# Provider/search endpoint URLs (Ollama, LM Studio, Custom OpenAI, SearXNG)
# have likewise migrated to the database (app_settings table, unencrypted).
# Manage them from Settings → API Keys / Model Settings / Search Providers.

[TOOLS.CODE_EXECUTION]
ENABLED = false
DOCKER_IMAGE = "node:slim"
DOCKER_HOST = "unix:///var/run/docker.sock"
TIMEOUT_SECONDS = 30
MEMORY_MB = 128
MAX_OUTPUT_CHARS = 50000

# [TOOLS.IMAGE_GENERATION] has been migrated to the database (app_settings
# table). Manage it from Settings → Image Generation. The OpenRouter API key it
# uses is encrypted in the database (`credentials` table).
